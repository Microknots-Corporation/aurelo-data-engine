version: "3.9"

services:
  db:
    image: postgres:15
    hostname: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .                # builds from your aurelo-data-engine repo
      dockerfile: Dockerfile    # keep this if Dockerfile is in the repo root
    image: aurelo-data-engine:dev
    container_name: aurelo-data-engine-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: postgres
      POSTGRE_USER: postgres
      POSTGRE_PASSWORD: postgres
      POSTGRE_PORT: 5432
      POSTGRE_HOST: db
      JSON_LOG: 1
      PORT: 8080
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
    # Mount your repo so code changes are visible inside the container
    volumes:
      - ./:/label-studio
      - ./mydata:/label-studio/data:rw
    working_dir: /label-studio
    # Dev server: install deps, migrate DB, then run Django dev server
    command: >
      bash -lc "
        python -m pip install -U pip &&
        pip install -r requirements.txt &&
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:${PORT:-8080}
      "
    ports:
      - "8080:8080"

volumes:
  pgdata:
